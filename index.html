

<!DOCTYPE html>
<html>
<head>
<title>Graph Making Tool</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Graph Making Tool</h1>

<input id="fn" placeholder="Enter function: x*x, sin(x)">

</html>
